# Catppuccin Mocha powerline theme, modeled on the supplied homelab Starship config.
"$schema" = 'https://starship.rs/config-schema.json'
format = """\
[](red)\
$os\
$username\
$hostname\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
[](fg:green bg:sapphire)\
$conda\
[ ](fg:lavender)\
$cmd_duration\
$line_break\
$character\
"""
right_format = "$time"
palette = 'catppuccin_mocha'

[os]
disabled = false
style = 'bg:red fg:crust'
[os.symbols]
Debian = '󰣚'
Linux = '󰌽'
Arch = '󰣇'
Ubuntu = '󰕈'
Fedora = '󰣛'
Alpine = ''
Macos = '󰀵'

[username]
show_always = true
style_user = 'bg:red fg:crust'
style_root = 'bg:red fg:crust'
format = '[ $user]($style)'

[hostname]
ssh_only = false
style = 'bg:red fg:crust'
format = '[@$hostname ]($style)'

[directory]
style = 'bg:peach fg:crust'
format = '[ $path ]($style)'
truncation_length = 6
truncation_symbol = '…/'
truncate_to_repo = false
[directory.substitutions]
'workspace' = '󰲋'
'dev' = '󰲋'
'Documents' = '󰈙'
'Downloads' = ''

[git_branch]
symbol = ''
style = 'bg:yellow'
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'
[git_status]
style = 'bg:yellow'
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[nodejs]
symbol = ''
style = 'bg:green'
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
[c]
symbol = ' '
style = 'bg:green'
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
[rust]
symbol = ''
style = 'bg:green'
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
[golang]
symbol = ''
style = 'bg:green'
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
[php]
symbol = ''
style = 'bg:green'
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
[java]
symbol = ' '
style = 'bg:green'
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
[kotlin]
symbol = ''
style = 'bg:green'
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
[haskell]
symbol = ''
style = 'bg:green'
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
[python]
disabled = true

[conda]
symbol = '  '
style = 'fg:crust bg:sapphire'
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
format = '[[  $time ](fg:#a0a9cb )]($style)'
time_format = '%R'

[line_break]
disabled = true
[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'
[cmd_duration]
show_milliseconds = true
format = ' in $duration '
style = 'bg:lavender'
disabled = false

[palettes.catppuccin_mocha]
rosewater = '#f5e0dc'
flamingo = '#f2cdcd'
pink = '#f5c2e7'
mauve = '#cba6f7'
red = '#f38ba8'
maroon = '#eba0ac'
peach = '#fab387'
yellow = '#f9e2af'
green = '#a6e3a1'
teal = '#94e2d5'
sky = '#89dceb'
sapphire = '#74c7ec'
blue = '#89b4fa'
lavender = '#b4befe'
text = '#cdd6f4'
subtext1 = '#bac2de'
subtext0 = '#a6adc8'
overlay2 = '#9399b2'
overlay1 = '#7f849c'
overlay0 = '#6c7086'
surface2 = '#585b70'
surface1 = '#45475a'
surface0 = '#313244'
base = '#1e1e2e'
mantle = '#181825'
crust = '#11111b'
